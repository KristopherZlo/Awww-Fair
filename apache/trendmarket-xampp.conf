# Include this file from XAMPP Apache, for example:
# Include "E:/xampp/htdocs/trendmarket/apache/trendmarket-xampp.conf"
#
# Required Apache modules:
# - mod_alias
# - mod_headers
# - mod_proxy
# - mod_proxy_http

ProxyPreserveHost On

<LocationMatch "^/(?!api(?:/|$))(?!trendmarket/api(?:/|$)).*">
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; media-src 'self'; manifest-src 'self'"
</LocationMatch>

ProxyPass "/api" "http://127.0.0.1:5176/api" retry=0
ProxyPassReverse "/api" "http://127.0.0.1:5176/api"
ProxyPass "/trendmarket/api" "http://127.0.0.1:5176/api" retry=0
ProxyPassReverse "/trendmarket/api" "http://127.0.0.1:5176/api"

RedirectMatch 302 ^/trendmarket$ /trendmarket/
Alias "/trendmarket/" "E:/xampp/htdocs/trendmarket/dist/"

<Directory "E:/xampp/htdocs/trendmarket/dist">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    FallbackResource /trendmarket/index.html
</Directory>
